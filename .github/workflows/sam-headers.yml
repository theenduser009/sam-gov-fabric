name: Verify published SAM.gov contract headers

on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PDF table reader
        run: python3 -m pip install --disable-pip-version-check pdfplumber==0.11.9
      - name: Rebuild header samples from GSA and verify the committed files
        run: |
          python3 scripts/generate-sam-headers.py --output-dir "$RUNNER_TEMP/sam-headers"
          cmp samples/sam-award-idv-headers.csv "$RUNNER_TEMP/sam-headers/sam-award-idv-headers.csv"
          cmp samples/sam-award-idv-field-map.csv "$RUNNER_TEMP/sam-headers/sam-award-idv-field-map.csv"
